name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk HallaMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: HallaMobile.apk

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Mobile ${{ github.ref_name }} — cores e arraste dos botões de sussurro
          draft: false
          prerelease: false
          files: HallaMobile.apk
          body: |
            ## Halla Mobile v1.0.13

            ### Lista de Sussurro
            * Corrigida a visibilidade do texto do nome da lista, canais e usuários no editor.
            * Campos, spinner e caixas de seleção agora usam cores legíveis no tema escuro.
            * Botões de sussurro flutuantes também podem ser arrastados pela tela.
            * A posição de cada botão é salva individualmente.

            ### PTT
            * O botão PTT permanece redondo durante toda a interação.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
