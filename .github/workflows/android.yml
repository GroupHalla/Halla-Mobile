name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk HallaMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: HallaMobile.apk

  release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Mobile ${{ github.ref_name }} — Painel Hierárquico e Keep-Alive NAT
          draft: false
          prerelease: false
          files: HallaMobile.apk
          body: |
            ## 🚀 Novidades do Halla Mobile ${{ github.ref_name }}

            Esta versão traz melhorias críticas de infraestrutura de rede VoIP e uma navegação de configurações totalmente reformulada:

            ### ⚙️ Painel de Configurações Hierárquico
            * **Navegação por Submenus:** As configurações agora são divididas em 4 submenus independentes (Geral, Áudio, Aparência e Sobre). Cada tela exibe exclusivamente os seus respectivos ajustes, evitando poluição visual e permitindo navegar de forma extremamente limpa e organizada!

            ### 📡 Keep-Alive Contínuo UDP para Furo de NAT
            * **Fim do Atraso de Voz:** Implementado um loop contínuo de sinalização keep-alive UDP em segundo plano no C++ nativo que dispara pings leves de 5 segundos. Isso mantém as portas de CGNAT/NAT de redes móveis ou Wi-Fi permanentemente ativas. A transmissão da sua voz agora funciona instantaneamente no primeiro segundo, sem depender de nenhuma fala prévia do PC!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
