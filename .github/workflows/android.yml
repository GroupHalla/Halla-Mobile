name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk HallaMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: HallaMobile.apk

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Mobile ${{ github.ref_name }} — Voz UDP, Identidades e Favoritos Persistentes
          draft: false
          prerelease: false
          files: HallaMobile.apk
          body: |
            ## Halla Mobile v1.0.8

            ### Correções de voz e conexão
            * Corrigido o início da captura antes da preparação do UDP, evitando que a voz do celular só funcionasse depois de alguém falar pelo PC.
            * Registro de NAT/endpoint UDP repetido e keep-alive controlado por threads gerenciadas.
            * Sinalização `talking` enviada ao servidor e encerrada corretamente ao mutar, parar ou desconectar.
            * Erros de permissão e senha de canal não derrubam mais a sessão inteira.
            * Entrada em canais protegidos por senha com diálogo no celular.
            * Encerramento seguro de sockets, threads e codecs Opus.

            ### Identidades e favoritos
            * UID escolhida no favorito agora é enviada de fato ao servidor.
            * Importação de UID do Halla Desktop e exportação por copiar/compartilhar.
            * Favoritos e identidades incluídos no Auto Backup/Device Transfer do Android.

            ### Interface e recursos
            * Abas de chat para servidor, canal e conversas privadas.
            * Mensagens privadas pelo menu do usuário.
            * Árvore de canais com subcanais hierárquicos e recolhimento recursivo.
            * Chave de privilégio disponível nas configurações gerais.
            * Melhorias no mute/deafen, PTT/VAD, roteamento Bluetooth e indicador de voz.
            * JSON de saída com escape correto para apelidos, senhas e mensagens.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
