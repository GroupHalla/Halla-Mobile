name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk HallaMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: HallaMobile.apk

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Mobile ${{ github.ref_name }} — idiomas, logo oficial e interface localizada
          draft: false
          prerelease: false
          files: HallaMobile.apk
          body: |
            ## Halla Mobile v1.0.19

            ### Idiomas e interface
            * Detecção automática do idioma do Android, com opção de escolher Português, Inglês ou Espanhol nas configurações.
            * Interface, diálogos, notificações, menus, mensagens de erro, árvore de canais e controles traduzidos.
            * Referências a produtos e aplicativos externos removidas do código e dos textos do projeto.
            * ID único continua sendo usado internamente para sincronização, mas não é exibido na interface.
            * Permissões de comandante respeitadas no menu de usuários.
            * Descrições de canais preservam espaçamento e aceitam imagens e links clicáveis.
            * Edição de canal envia e preserva bitrate entre 16 e 384 kbps, com padrão de 96 kbps.
            * Registro UDP força um frame Opus válido para que o áudio não dependa da fala inicial do PC.
            * Configuração móvel de sinais sonoros: Ativo, Inativo e Sussurro, com arquivos escolhidos pelo usuário.
            * Clientes autorizados podem definir ou remover comandantes pelo menu do usuário.

            ### Identidade visual
            * Logo oficial do Halla aplicada à barra superior, ao banner do servidor e ao botão central de transmissão.
            * Mantidos os controles de áudio, PTT, listas de sussurro e atualização automática.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
