name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk HallaMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: HallaMobile.apk

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Mobile ${{ github.ref_name }} — Foreground Service, PTT flutuante e reconexão
          draft: false
          prerelease: false
          files: HallaMobile.apk
          body: |
            ## Halla Mobile v1.0.10

            ### Sessão em segundo plano
            * Foreground Service com notificação fixa e ações rápidas para mutar o microfone, mutar os fones e desconectar.
            * A conexão não é encerrada quando a Activity é minimizada, destruída ou a tela é apagada.
            * Reconexão silenciosa durante a troca de Wi-Fi para 4G/5G, mantendo a mesma identidade e servidor.

            ### Áudio e conectividade
            * PTT flutuante opcional sobre outros aplicativos mediante a permissão do Android.
            * Ping e perda de pacotes exibidos no cartão do servidor com indicação verde/amarela/vermelha.
            * Mensagens privadas e cutucões geram notificação/vibração mesmo com o app em segundo plano.
            * Atualizador baixa o APK da release e abre o instalador do Android, sem redirecionar o usuário para o navegador.

            ### Interface
            * O botão inferior mostra **FALAR** quando parado e **FALANDO** durante a transmissão.
            * Pressionar um canal exibe a descrição e o tópico.
            * A seta de retorno das configurações voltou ao símbolo de seta.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
