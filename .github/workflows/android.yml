name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk HallaMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: HallaMobile.apk

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Mobile ${{ github.ref_name }} — Whisper mobile e PTT personalizado
          draft: false
          prerelease: false
          files: HallaMobile.apk
          body: |
            ## Halla Mobile v1.0.12

            ### Push-to-Talk e sussurro
            * Corrigido o botão PTT para permanecer redondo durante a transmissão.
            * A posição do PTT flutuante agora pode ser personalizada arrastando o botão pela tela.
            * Adicionadas Listas de Sussurro para canais e usuários do servidor.
            * Cada lista pode ter seu próprio botão flutuante, permitindo vários atalhos de sussurro.
            * Sussurros funcionam mesmo quando o modo geral de transmissão está em VAD.

            ### Primeiro áudio UDP
            * O cliente Desktop também registra seu endpoint com frames não vazios, corrigindo o caso em que o Mobile só era ouvido depois da primeira fala do PC.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
