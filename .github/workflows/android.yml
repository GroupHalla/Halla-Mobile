name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk HallaMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: HallaMobile.apk

  release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Mobile ${{ github.ref_name }} — Voz Opus e Canais Sincronizados
          draft: false
          prerelease: false
          files: HallaMobile.apk
          body: |
            ## 🚀 Lançamento Oficial do Halla Mobile ${{ github.ref_name }}

            Esta versão traz uma reestruturação profunda nas camadas de rede e áudio, garantindo compatibilidade e qualidade profissional!

            ### 📱 Recursos Integrados nesta Versão
            * **Codec Opus Nativo:** Suporte completo à compressão e descompressão do codec Opus oficial diretamente no NDK, oferecendo áudio límpido e com zero distorção!
            * **Sincronia Nativa de Árvore de Canais:** Resolvedor unificado que mapeia instantaneamente as salas e os usuários de forma perfeita ao conectar!
            * **Atualizações de Canais Live:** Suporte à escuta e redesenho de tela instantâneo para edições, criações e deleções de salas em tempo real.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
