name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk HallaMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: HallaMobile.apk

  release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Halla Mobile v1.0.0 — Versão Inicial Kotlin/NDK
          draft: false
          prerelease: false
          files: HallaMobile.apk
          body: |
            ## 🚀 Lançamento Oficial do Halla Mobile v1.0.0 (Kotlin + C/C++ NDK)

            Esta é a versão móvel reescrita nativamente em Kotlin para uma UI fluida e robusta, com núcleo de rede em C/C++ (JNI) de alta performance!

            ### 📱 Recursos Integrados
            * **Arquitetura Híbrida de Elite:** Interface 100% nativa Kotlin acoplada a um núcleo de sockets TCP/UDP e de voz em C/C++!
            * **Conexão Dinâmica:** Insira o IP e porta do seu servidor, configure o seu apelido e conecte-se instantaneamente!
            * **Lista de Canais e Árvore de Usuários em Tempo Real:** Navegação e sincronização nativa na UI Kotlin.
            * **Áudio Nativo de Baixíssima Latência:** Captura de microfone com `AudioRecord` e reprodução de som com `AudioTrack` para máxima fluidez de voz no Android.
            * **DSP & VAD Nativo em Kotlin:** Monitoramento em tempo real de nível RMS e detecção de atividade de voz (VAD) inteligente!
            * **Gravação Local WAV:** Grave canais de áudio de voz em tempo real diretamente na pasta de cache do app!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
