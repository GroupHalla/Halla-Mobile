name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk HallaMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: HallaMobile.apk

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Mobile ${{ github.ref_name }} — Voz UDP, Identidades e Favoritos Persistentes
          draft: false
          prerelease: false
          files: HallaMobile.apk
          body: |
            ## 🚀 Novidades do Halla Mobile ${{ github.ref_name }}

            Esta versão estende o ecossistema com suporte completo a controles de áudio, identidades e administração direta do celular:

            ### 🔊 Roteamento de Áudio & Hardware Inteligente
            * **Alternância Rápida:** Botão na barra superior para alternar instantaneamente entre **Viva-Voz (Speaker)** e **Alto-falante de Ouvido (Earpiece)**.
            * **Sensor de Proximidade:** Apaga a tela do celular automaticamente ao encostar na orelha no modo Earpiece, prevenindo toques acidentais.
            * **Suporte a Bluetooth (SCO):** Reconhecimento e roteamento nativo automático ao conectar fones Bluetooth ou som de carros.

            ### 👥 Identidades Múltiplas e Import/Export
            * **Múltiplos Perfis:** Gerencie e crie várias identidades (UIDs) nas configurações gerais.
            * **Escolha por Favorito:** Vincule uma identidade específica para cada servidor salvo (favorito).
            * **Sincronização:** Copie a UID (exportar) ou cole/importe a UID do cliente Desktop para manter seus cargos e grupos de servidor.

            ### 📂 Árvore Sanfona (Expand/Collapse)
            * **Organização de Canais:** Toque em qualquer canal com subcanais para expandir ou recolher a árvore inteira, economizando espaço de tela útil.

            ### 💬 Interação Social Avançada
            * **Cutucar (Poke):** Envie e receba cutucões que geram **vibração física de 300ms**, alerta sonoro e pop-up em tela.
            * **Informações do Cliente:** Toque em qualquer usuário para abrir o menu que permite visualizar IP, Ping, Versão do App, Uptime e grupos associados.

            ### ⚙️ Administração e Moderação Mobile
            * **Ações Rápidas:** Toque em qualquer membro para abrir o menu de moderador e aplicar **Kick do Canal**, **Kick do Servidor**, **Ban** ou para **Mover Usuário** entre salas.
            * **Edição de Canal:** Altere o nome, descrição ou senha de qualquer sala diretamente do smartphone.
            * **Mutar Microfone com Fone:** Ao mutar os fones (Deafen), o microfone agora se muta automaticamente por segurança.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
