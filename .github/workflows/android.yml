name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HallaMobile.apk
          sha256sum HallaMobile.apk > HallaMobile.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: |
            HallaMobile.apk
            HallaMobile.apk.sha256

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Mobile ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            HallaMobile.apk
            HallaMobile.apk.sha256
          body: |
            ## Halla Mobile ${{ github.ref_name }}

            ### WebRTC signaling
            * Adiciona callbacks e helpers de signaling WebRTC no Mobile para watch_request/stop, answer e ICE.
            * O botão Ver transmissão já envia webrtc_watch_request e o X envia webrtc_watch_stop.
            * Base inicial para substituir o antigo screen share JPEG/UDP por WebRTC.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
