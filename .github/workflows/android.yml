name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Install Host Qt (Desktop Linux)
        id: install-qt-host
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.2'
          target: 'desktop'
          arch: 'linux_gcc_64'
          dir: '${{ github.workspace }}/../Qt'

      - name: Save Host Qt Path
        run: |
          echo "HOST_QT_PATH=${QT_ROOT_DIR}" >> $GITHUB_ENV

      - name: Install Target Qt (Android)
        id: install-qt-target
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.2'
          target: 'android'
          arch: 'android_arm64_v8a'
          dir: '${{ github.workspace }}/../Qt'

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }} \
            -DQT_HOST_PATH=${{ env.HOST_QT_PATH }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: |
          cmake --build build --target HallaMobileApp

      - name: Create APK with androiddeployqt
        run: |
          ${{ env.QT_ROOT_DIR }}/bin/androiddeployqt --input build/android-HallaMobileApp-deployment-settings.json --output build/android-build --gradle
          find build/android-build/ -name "*.apk" -exec cp {} HallaMobile.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: HallaMobile.apk

  release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Halla Mobile v1.0.0 — Versão Inicial do Aplicativo Móvel
          draft: false
          prerelease: false
          files: HallaMobile.apk
          body: |
            ## 🚀 Lançamento Oficial do Halla Mobile v1.0.0

            Esta é a versão móvel inicial do aplicativo de comunicação por voz de alta fidelidade Halla!

            ### 📱 Recursos Integrados
            * **Conexão Dinâmica:** Insira o IP e porta do seu servidor, configure o seu apelido e conecte-se instantaneamente!
            * **Lista de Canais em Tempo Real:** Navegue pelas salas do servidor em uma interface touch otimizada para celulares.
            * **Navegação com Toque:** Mude de canal clicando diretamente na sala desejada.
            * **Chat Integrado:** Envie e receba mensagens de texto no chat da sala de forma sincronizada com o servidor!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
