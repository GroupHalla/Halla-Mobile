name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk HallaMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: HallaMobile.apk

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Mobile ${{ github.ref_name }} — sinais sonoros de fala
          draft: false
          prerelease: false
          files: HallaMobile.apk
          body: |
            ## Halla Mobile v1.0.21

            ### Sinais sonoros de fala
            * Nova configuração em **Configurações → Áudio → Diversos**.
            * Escolha entre **Pressione para Falar** e **Atividade de Voz**.
            * Selecione arquivos de áudio separados para **Ativo**, **Inativo** e **Sussurro** pelo seletor de arquivos do Android.
            * Cada sinal possui a opção **Outros usuários** para reproduzir o áudio quando outra pessoa falar.
            * A reprodução funciona também com o serviço de áudio em segundo plano.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
