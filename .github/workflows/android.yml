name: Build, test and release Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Validate version/tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME não corresponde a VERSION=$version" >&2
            exit 1
          fi

      - name: Fetch and verify patched Halla WebRTC Android SDK
        run: ./tools/fetch_webrtc_android.sh

      - name: Unit tests and Android lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build debug artifact
        if: github.ref_type != 'tag'
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk HallaMobile-debug.apk
          sha256sum HallaMobile-debug.apk > HallaMobile-debug.apk.sha256

      - name: Decode release keystore
        if: github.ref_type == 'tag'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          HALLA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HALLA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HALLA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 HALLA_ANDROID_STORE_PASSWORD HALLA_ANDROID_KEY_ALIAS HALLA_ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "GitHub Secret ausente: $name" >&2; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/halla-release.jks"
          chmod 600 "$RUNNER_TEMP/halla-release.jks"

      - name: Build signed release APK
        if: github.ref_type == 'tag'
        env:
          HALLA_ANDROID_KEYSTORE: ${{ runner.temp }}/halla-release.jks
          HALLA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HALLA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HALLA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon -PrequireReleaseSigning=true assembleRelease
          cp app/build/outputs/apk/release/app-release.apk HallaMobile.apk
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [[ -x "$APKSIGNER" ]] || { echo "apksigner not found under $ANDROID_SDK_ROOT/build-tools" >&2; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs HallaMobile.apk
          sha256sum HallaMobile.apk > HallaMobile.apk.sha256

      # Bibliotecas do complemento oficial "Voz de rádio policial" para o
      # pacote .halla-addon do catálogo (Halla-Addons). Não entram no APK: o
      # CI publica os .so das quatro ABIs como artefato, que alimenta o
      # pacote multiplataforma junto à DLL do Halla Desktop.
      - name: Build radio-voice addon libraries
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          [[ -d "$NDK" ]] || { echo "NDK 25.2.9519653 não encontrado" >&2; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cmake -S app/src/main/cpp/addons/radio-voice -B "build-addon-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "build-addon-$abi"
          done
          mkdir -p dist-addon/android-arm64 dist-addon/android-arm \
                   dist-addon/android-x86_64 dist-addon/android-x86
          cp build-addon-arm64-v8a/libradio_voice.so dist-addon/android-arm64/
          cp build-addon-armeabi-v7a/libradio_voice.so dist-addon/android-arm/
          cp build-addon-x86_64/libradio_voice.so dist-addon/android-x86_64/
          cp build-addon-x86/libradio_voice.so dist-addon/android-x86/
          (cd dist-addon && sha256sum android-*/*.so)

      - name: Upload radio-voice addon libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halla-radio-voice-android
          if-no-files-found: error
          retention-days: 90
          path: |
            dist-addon/android-arm64/libradio_voice.so
            dist-addon/android-arm/libradio_voice.so
            dist-addon/android-x86_64/libradio_voice.so
            dist-addon/android-x86/libradio_voice.so

      - name: Upload CI artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halla-mobile-debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            HallaMobile-debug.apk
            HallaMobile-debug.apk.sha256

      - name: Upload signed release artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halla-mobile-release
          if-no-files-found: error
          path: |
            HallaMobile.apk
            HallaMobile.apk.sha256

  release:
    if: github.ref_type == 'tag'
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: halla-mobile-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Mobile ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            HallaMobile.apk
            HallaMobile.apk.sha256
