name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk HallaMobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halla-mobile-apk
          path: HallaMobile.apk

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: halla-mobile-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Halla Mobile ${{ github.ref_name }} — PTT configurável e serviço em segundo plano
          draft: false
          prerelease: false
          files: HallaMobile.apk
          body: |
            ## Halla Mobile v1.0.11

            ### Push-to-Talk
            * Corrigido o modo PTT: ao selecionar PTT, o áudio fica bloqueado até o usuário pressionar o botão.
            * A alteração do modo agora é sincronizada com o Foreground Service, evitando que o serviço continue em VAD.
            * A aba Configurações > Áudio mostra opções extras somente quando PTT está selecionado.
            * PTT flutuante opcional sobre jogos e outros aplicativos.
            * Seleção da posição do botão flutuante: superior/inferior, esquerda/direita.

            ### Serviço em segundo plano
            * A notificação fixa mantém os controles de microfone, fones e desconexão.
            * A sessão continua ativa ao apagar a tela ou minimizar o aplicativo.
            * Reconexão automática durante a troca de Wi-Fi para 4G/5G.
            * Ping e perda de pacotes visíveis no cartão do servidor.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
